[package]
name = "blue-moth"
version = "2.2.0"
description = "Blue Moth 2.2 – Bibliothek für Web-Apps, Programme und Spiele"
authors = ["Blue Moth"]
edition = "2021"

[lib]
name = "blue_moth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
